name: Report a problem
description: Something in Mainstream isn't working as expected.
labels: ["ISSUE"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Mainstream better. Tell us what you were trying to do and what got in the way. You don't need to know what's causing it.

        Please check [existing reports](https://github.com/MainstreamOS/dots-hyprland/issues?q=is%3Aissue) first. For help finding a setting or making something your own, start a [discussion](https://github.com/MainstreamOS/dots-hyprland/discussions) or ask in the [Mainstream Discord](https://discord.gg/WJ3AUK5Aqd).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What were you trying to do, what did you expect, and what happened instead?
      placeholder: Include the exact error message if there is one. A screenshot or short recording can help too.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we try it?
      description: Walk us through the steps. If it only happens sometimes, say how often and anything you've noticed.
      placeholder: |
        1. Open ...
        2. Change ...
        3. ...
    validations:
      required: false
  - type: dropdown
    id: installation
    attributes:
      label: How did you install Mainstream?
      options:
        - Mainstream ISO
        - Installer on an existing Arch-based system
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Your version and computer
      description: Include the Mainstream version from Settings → About, or the ISO filename if the desktop won't start. Your computer model, graphics card and display setup can help us reproduce it. Share what you know.
      placeholder: |
        Mainstream version or ISO:
        Computer and graphics:
        Displays and scaling, if relevant:
        Did this start after an update or a settings change?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostic information
      description: |
        If an install or update failed, attach the output from that attempt. For desktop problems, `qs log -c ii --tail 200` reads the recent shell log without restarting your desktop.

        If you have this repository checked out, you can also run `./diagnose` there and attach `diagnose.result`. If you can't get logs, tell us where you got stuck; you can still submit the report. Remove passwords, API keys and anything private before posting.
      placeholder: Paste relevant output here, or attach a log file.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else that might help?
      description: Things you've already tried, local changes, a workaround, or the last version that worked.
    validations:
      required: false
