# Mainstream OS — deprioritize HDMI/DisplayPort sinks for the auto-default pick
#
# WirePlumber 0.5 ranks output sinks for the "default sink" pick by their
# priority.session / priority.driver properties. Discrete GPUs (NVIDIA, Intel
# Arc, AMD) expose their HDMI/DP audio endpoints with priorities high enough
# that WirePlumber will pick the GPU's HDMI sink over the motherboard analog
# codec on systems with both — silent audio out of the box even though the
# user has speakers plugged into the motherboard.
#
# Lower the session/driver priority on any sink whose node.name matches an
# HDMI ALSA endpoint. A motherboard analog sink with default ~1000 priority
# now sorts above an HDMI sink at 500, and WirePlumber's default-picker
# chooses analog.
#
# This only affects the *initial* pick. Users who explicitly set a different
# default via `wpctl set-default <id>` or pavucontrol persist that choice in
# their per-user WirePlumber state and override this rule.
#
# SPA-JSON drop-in syntax — anything ending in .conf under
# /etc/wireplumber/wireplumber.conf.d/ is merged into WirePlumber's config
# tree on startup.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver  = 500
      }
    }
  }
]
