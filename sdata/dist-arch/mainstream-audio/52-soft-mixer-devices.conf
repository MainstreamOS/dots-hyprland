# Audio chips from MV-SILICON (fifine and other brands) use a linear volume scale
# but report it in decibels, 0 to +16 dB on the fifine headset, with a lowest step
# that is really silent. So the bottom half of the volume slider did nothing.
# PipeWire does their volume in software instead, with the hardware at full level.
# They all share one manufacturer name, while their USB IDs vary and can collide.

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.longname = "~MV-SILICON.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
