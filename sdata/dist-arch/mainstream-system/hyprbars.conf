# /etc/hyprbars.conf
# Configuration for /usr/local/lib/hyprbars/rebuild.sh — the pacman hook
# that rebuilds the hyprbars Hyprland plugin on every `hyprland`
# install/upgrade.
#
# All settings are optional. The defaults give zero-touch operation:
# rebuild.sh tries the previously-known-good commit, then matching
# version tags, then the default branch, and finally walks history
# backward until a buildable commit is found. The first working ref is
# cached for the next run.
#
# Sourced as bash — uncomment any line below to override.

# Source repo for hyprland-plugins. Defaults to MainstreamOS's fork,
# which carries the stencil-mask fix for title bars rendering wrong on
# NVIDIA while blur is on. Point this back at hyprwm/hyprland-plugins
# with HYPRBARS_DEFAULT_BRANCH="main" once that lands upstream.
#HYPRBARS_REPO="https://github.com/hyprwm/hyprland-plugins"

# Default branch the rebuild script tries last in its fallback chain and
# walks backwards through. Defaults to "mainstream", the fork's branch.
# Override alongside HYPRBARS_REPO when building from somewhere else.
#HYPRBARS_DEFAULT_BRANCH="mainstream"

# Pin to an explicit ref (tag, branch, or commit SHA). When set, the
# auto-detect / fallback chain is skipped and a build failure is fatal.
# Useful when you want reproducible builds across machines, or to lock
# to a known-good commit while the source is broken.
#HYPRBARS_REF=""

# Cap on how many commits the auto-walk-back will try after primary
# candidates fail. Each attempt is a clean build (~10 sec on modern
# hardware). Increase for very stale systems, decrease to bail sooner.
#WALK_DEPTH=15
