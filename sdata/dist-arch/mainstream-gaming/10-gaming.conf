[Unit]
# Gaming Mode flips sessions by restarting sddm; stock StartLimitBurst=2 per
# StartLimitIntervalSec=30 trips "start request repeated too quickly" on a flurry of
# enter/exit/enter and wedges a black screen with no display manager. Raise the
# ceiling (a finite window still backs off a genuine crash loop).
StartLimitIntervalSec=10
StartLimitBurst=20

[Service]
# OS-first + one-shot autologin, run before every sddm start. arm-check consumes the
# /run/gaming-mode-armed marker on a deliberate entry and otherwise strips the
# autologin User= so a cold boot / crash-restart reaches the password greeter;
# seed-session pins the greeter's default tile to Hyprland. The `-` prefix means a
# hiccup in either can never block the display manager from starting.
ExecStartPre=-/usr/bin/gaming-mode-arm-check
ExecStartPre=-/usr/bin/gaming-mode-seed-session
