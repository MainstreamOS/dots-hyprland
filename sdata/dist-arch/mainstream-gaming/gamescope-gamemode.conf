[Service]
# The whole session is for games, so everything it starts asks GameMode for
# the performance profile, the same way gamemoderun would. gamescope itself
# runs with capabilities, so the loader leaves it alone; Steam and the games
# it launches take the preload, and Steam's container runtime carries it
# through to games running inside it.
Environment=LD_PRELOAD=libgamemodeauto.so.0
