[Service]
# gamescope is the compositor for this session and must drive DRM/KMS directly.
# SDDM (DisplayServer=wayland) and the outgoing Hyprland session can leave a stale
# WAYLAND_DISPLAY in the user environment; gamescope then tries to nest in that
# (now-gone) socket and exits with "Failed to connect to wayland socket" -- even when
# --backend drm is passed, because it attempts the connect before backend selection.
# Strip WAYLAND_DISPLAY (and DISPLAY) from the service so gamescope always uses DRM.
UnsetEnvironment=WAYLAND_DISPLAY DISPLAY
