[Users]
# Pin the greeter's default session to Hyprland and keep it pinned. With
# RememberLastSession=true (the SDDM default) a single gaming login would rewrite
# [Last] Session=gamescope into state.conf and the next cold boot's greeter would
# preselect gaming again. false freezes [Last] Session at whatever
# gaming-mode-seed-session writes on each boot (hyprland.desktop), so the
# greeter always opens on the desktop and a password is required to do anything else.
# Neither /etc/sddm.conf nor 10-wayland.conf sets these keys, so this drop-in is the
# winning value (no higher-precedence conflict in /etc/sddm.conf to override it).
RememberLastSession=false
RememberLastUser=true
