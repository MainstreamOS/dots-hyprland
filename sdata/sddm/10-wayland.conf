[General]
DisplayServer=wayland
# layer-shell: the Qt greeter draws as a layer-shell client under Hyprland.
# QML_XHR_ALLOW_FILE_READ: the theme's layout picker reads the keyboard
# bridge's state file through XMLHttpRequest, which Qt refuses for local files
# unless told to.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1

[Wayland]
CompositorCommand=start-hyprland

[Theme]
Current=pixie
