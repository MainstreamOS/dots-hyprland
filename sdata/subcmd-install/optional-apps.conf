# Optional groups shared by the terminal picker and the ISO's Calamares config.
    - name: "🌐 Web Browsers"
      description: "Web browsers for everyday browsing."
      selected: false
      critical: false
      packages:
          - name: firefox
            display: "Firefox"
            description: "Fast, private, and open-source web browser."
          - name: chromium
            display: "Chromium"
            description: "Open-source base of Google Chrome. No proprietary Google bits."
          - name: com.brave.Browser
            display: "Brave"
            description: "Privacy-focused browser with built-in ad blocking."
          - name: io.gitlab.librewolf-community
            display: "LibreWolf"
            description: "Hardened Firefox fork with strict privacy defaults."
          - name: zen-browser-bin
            display: "Zen Browser"
            description: "Performance-focused Firefox fork with a clean, modern UI."

    - name: "💻 Development Tools"
      description: "IDEs, editors, version control, and containerization."
      selected: false
      critical: false
      packages:
          - name: code
            display: "VS Code (OSS)"
            description: "Microsoft's open-source build. No proprietary marketplace."
          - name: com.visualstudio.code
            display: "Visual Studio Code"
            description: "Proprietary Microsoft build with full marketplace support."
          - name: alacritty
            display: "Alacritty"
            description: "Blazing-fast GPU-accelerated terminal emulator."
          - name: ghostty
            display: "Ghostty"
            description: "Fast, native, feature-rich terminal emulator."
          - name: neovim
            display: "Neovim"
            description: "Hyperextensible Vim-based terminal editor."
          - name: vim
            display: "Vim"
            description: "Classic, highly configurable terminal text editor."
          - name: io.github.shiftey.Desktop
            display: "GitHub Desktop"
            description: "Official Git GUI client for managing repositories."
          - name: docker
            display: "Docker"
            description: "Build, ship, and run containerized applications."
          - name: io.dbeaver.DBeaverCommunity
            display: "DBeaver"
            description: "Universal SQL client for MySQL, PostgreSQL, SQLite, MongoDB, and more."

