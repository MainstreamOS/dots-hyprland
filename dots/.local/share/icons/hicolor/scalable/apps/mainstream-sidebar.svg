<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Sidebar">
  <defs>
    <linearGradient id="tileFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2e36"/>
      <stop offset="100%" stop-color="#27292f"/>
    </linearGradient>
    <linearGradient id="tileBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#868da0" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#565c69" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="tileDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dy="2" result="o"/>
      <feFlood flood-color="#000000" flood-opacity="0.28" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(6.0,6.0) scale(0.9)">
