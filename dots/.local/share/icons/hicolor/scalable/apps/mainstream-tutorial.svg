<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Welcome to Mainstream">
  <defs>
    <linearGradient id="tileFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2e36"></stop>
      <stop offset="100%" stop-color="#27292f"></stop>
    </linearGradient>
    <linearGradient id="tileBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#868da0" stop-opacity="0.34"></stop>
      <stop offset="42%" stop-color="#565c69" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0.28"></stop>
    </linearGradient>
    <filter id="tileDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"></feGaussianBlur>
      <feOffset in="b" dy="2" result="o"></feOffset>
      <feFlood flood-color="#000000" flood-opacity="0.28" result="c"></feFlood>
      <feComposite in="c" in2="o" operator="in" result="s"></feComposite>
      <feMerge>
        <feMergeNode in="s"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e9bb6"></stop>
      <stop offset="100%" stop-color="#1f80c8"></stop>
    </linearGradient>
  </defs>
  <g transform="translate(6.0,6.0) scale(0.9)">
  <g filter="url(#tileDrop)">
    <rect x="3" y="2" width="114" height="114" rx="24.5" fill="url(#tileFace)"></rect>
    <rect x="3.6" y="2.6" width="112.8" height="112.8" rx="23.9" fill="none" stroke="url(#tileBevel)" stroke-width="1.2"></rect>
  </g>
  
  <g fill="none" stroke="url(#streamGrad)" stroke-width="3.5" stroke-linecap="round">
    <path d="M 46 40 C 50 34 42 28 46 20" opacity="0.95"></path>
    <path d="M 60 40 C 64 34 56 28 60 20" opacity="0.75"></path>
    <path d="M 74 40 C 78 34 70 28 74 20" opacity="0.55"></path>
  </g>
  
  <rect x="34" y="50" width="44" height="44" rx="4" fill="#c9ccd4"></rect>
  
  <path d="M 78 60 C 92 60 92 84 78 84" fill="none" stroke="#c9ccd4" stroke-width="6" stroke-linecap="round"></path>
  
  <rect x="28" y="96" width="56" height="4" rx="2" fill="#c9ccd4" opacity="0.65"></rect>
  </g>
</svg>