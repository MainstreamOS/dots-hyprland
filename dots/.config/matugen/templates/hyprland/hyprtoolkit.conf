# This configuration is generated by matugen for Hyprtoolkit
# Changing these variables with matugen still enabled will overwrite them.

# M3 Surface Tonal Hierarchy
background = rgba({{colors.surface.default.hex_stripped}}FF)
base = rgba({{colors.surface_container.default.hex_stripped}}FF)
alternate_base = rgba({{colors.outline_variant.default.hex_stripped}}FF)

# Typography & Text
text = rgba({{colors.on_surface.default.hex_stripped}}FF)
bright_text = rgba({{colors.on_primary.default.hex_stripped}}FF)
link_text = rgba({{colors.primary.default.hex_stripped}}FF)

# M3 Primary Accent
accent = rgba({{colors.primary.default.hex_stripped}}FF)
accent_secondary = rgba({{colors.secondary.default.hex_stripped}}FF)

# Geometry & Rounding
rounding_large = 18
rounding_small = 10

# Fonts
font_family = Google Sans Flex
font_family_monospace = JetBrains Mono NF
font_size = 11
h1_size = 19
h2_size = 16
h3_size = 13
small_font_size = 10
