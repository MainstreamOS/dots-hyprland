$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || { pidof hyprlock >/dev/null || hyprlock; }
# $lock_cmd = pidof hyprlock || hyprlock
# Idle sleep is skipped on the legacy NVIDIA driver branches (580, 470, 390):
# the desktop does not reliably come back from it on them. Settings says so
# on the Power page, and suspending by hand still works.
$suspend_cmd = grep -qE '^(580|470|390)[.]' /sys/module/nvidia/version 2>/dev/null || { systemctl suspend || loginctl suspend; }

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = sleep 0.5 && loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
