$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || { pidof hyprlock >/dev/null || hyprlock; }
# $lock_cmd = pidof hyprlock || hyprlock
# Idle sleep is skipped on hardware that does not come back from it: RDNA4
# cards, and the NVIDIA driver branches the legacy edition ships. The desktop
# is left running instead, and Settings > Power says so on those machines.
$suspend_cmd = lspci -nn 2>/dev/null | grep -qiE 'Navi 4[0-9]|RX 9[0-9]{3}' || grep -qE '^(580|470|390)[.]' /sys/module/nvidia/version 2>/dev/null || { systemctl suspend || loginctl suspend; }

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = sleep 0.5 && loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
